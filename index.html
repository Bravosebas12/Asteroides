<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100vh;
    }
    canvas {
      display: block;
      border: 1px solid #222;
    }
    #controls {
      display: flex;
      gap: 10px;
    }
    #controls button {
      background: #000;
      border: 1px solid #333;
      color: #fff;
      font: 13px monospace;
      letter-spacing: 1px;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #controls button:hover { border-color: #888; }
    #controls button:active { color: #888; }
    /* DEBUG: remove this rule together with #debug-controls before release */
    #debug-controls button { border-color: #4a3a00; color: #ffcc55; }
    #debug-controls button:hover { border-color: #ffcc55; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>

  <div id="controls">
    <button id="btn-pause" type="button">&#10074;&#10074; PAUSA</button>

    <!-- DEBUG: testing-only control, remove this div before release -->
    <span id="debug-controls">
      <button id="btn-skip" type="button">&#9654;&#9654; NIVEL+</button>
    </span>
  </div>

  <script src="game.js"></script>
</body>
</html>
